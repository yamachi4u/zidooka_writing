name: Publish Article (ZIDOOKA)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
      - '.github/workflows/publish-article.yml'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Draft path'
        required: true
        type: string
      publish_mode:
        description: 'Publish mode'
        required: true
        type: choice
        default: publish_now
        options:
          - publish_now
          - schedule_at
          - next_available
      publish_at:
        description: 'Schedule time: YYYY-MM-DD HH:mm'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WP_API_URL: ${{ secrets.WP_API_URL }}
      WP_MEDIA_API_URL: ${{ secrets.WP_MEDIA_API_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_TIMEZONE: ${{ secrets.WP_TIMEZONE || 'Asia/Tokyo' }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_SITE_URL: 'https://www.zidooka.com'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Select draft
        id: draft
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "path=$INPUT_DRAFT" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -E '^drafts/.*-(jp|ja)\.md$' | head -n 1 >> changed.txt || true
            DRAFT_PATH=$(head -n 1 changed.txt || true)
            if [ -z "$DRAFT_PATH" ]; then
              echo "No bilingual draft changed; nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "path=$DRAFT_PATH" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish bilingual pair
        if: steps.draft.outputs.skip != 'true'
        env:
          DRAFT_PATH: ${{ steps.draft.outputs.path }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH_MODE" = "schedule_at" ]; then
            test -n "$PUBLISH_AT"
            node src/index.js schedule-pair "$DRAFT_PATH" "$PUBLISH_AT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH_MODE" = "next_available" ]; then
            node src/index.js schedule-pair "$DRAFT_PATH"
          else
            node src/index.js post-pair "$DRAFT_PATH" --now
          fi
