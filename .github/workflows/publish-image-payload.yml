name: Publish Chunked Image Payload (ZIDOOKA)

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [closed]
    paths:
      - 'image-payloads/**'

jobs:
  publish-payload:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      WP_API_URL: ${{ secrets.WP_API_URL }}
      WP_MEDIA_API_URL: ${{ secrets.WP_MEDIA_API_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_TIMEZONE: ${{ secrets.WP_TIMEZONE || 'Asia/Tokyo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Get changed payload directories
        id: changed
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const dirs = [...new Set(data
              .map(f => f.filename)
              .filter(f => /^image-payloads\/[^/]+\/\d+\.b64part$/.test(f))
              .map(f => f.split('/').slice(0, 2).join('/')))];
            console.log('payload dirs:', dirs.join(', ') || '(none)');
            return dirs.join(' ');

      - name: Decode and publish thumbnails
        shell: bash
        run: |
          set -euo pipefail

          inject_thumbnail() {
            local file="$1"
            local image="$2"
            if grep -Eq '^(thumbnail|featured_image):' "$file"; then
              sed -i -E "s#^(thumbnail|featured_image):.*#thumbnail: \"$image\"#" "$file"
              return
            fi
            awk -v image="$image" '
              BEGIN { in_frontmatter=0; added=0 }
              NR == 1 && $0 == "---" { in_frontmatter=1 }
              {
                print
                if (in_frontmatter && !added && $0 ~ /^slug:/) {
                  print "thumbnail: \"" image "\""
                  added=1
                }
              }
              NR > 1 && in_frontmatter && $0 == "---" { in_frontmatter=0 }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          }

          for dir in ${{ steps.changed.outputs.result }}; do
            payload_name="$(basename "$dir")"
            meta="$dir/meta.txt"
            base="$(sed -n 's/^article_base=//p' "$meta" | head -n1 || true)"
            [ -n "$base" ] || base="$payload_name"
            ext="$(sed -n 's/^ext=//p' "$meta" | head -n1 || true)"
            [ -n "$ext" ] || ext="jpg"

            mkdir -p images
            image="images/${base}.${ext}"
            find "$dir" -maxdepth 1 -type f -name '*.b64part' -print0 \
              | sort -z \
              | xargs -0 cat \
              | tr -d '\r\n' \
              | base64 --decode > "$image"

            bytes="$(wc -c < "$image")"
            echo "Decoded $image ($bytes bytes)"
            [ "$bytes" -gt 25000 ] || { echo "Image payload unexpectedly small"; exit 1; }

            draft="$(find drafts -type f \( -name "${base}-jp.md" -o -name "${base}-ja.md" \) | head -n 1 || true)"
            [ -n "$draft" ] || { echo "No matching JP/JA draft for $base"; exit 1; }
            dir2="$(dirname "$draft")"
            stem="$(basename "$draft")"
            if [[ "$stem" == *-jp.md ]]; then
              pair="$dir2/${stem%-jp.md}-en.md"
            else
              pair="$dir2/${stem%-ja.md}-en.md"
            fi
            [ -f "$pair" ] || { echo "No EN pair for $draft"; exit 1; }

            inject_thumbnail "$draft" "$image"
            inject_thumbnail "$pair" "$image"
            node src/index.js post-pair "$draft" --now
          done

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '## 🖼️ Chunked image payload\n\nDecoded image payload(s) and ran the WordPress thumbnail publisher. See this workflow run for byte count and publish output.'
            });
