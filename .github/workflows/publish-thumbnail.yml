name: Publish Article Thumbnail (ZIDOOKA)

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [closed]
    paths:
      - 'images/**'

jobs:
  publish-thumbnail:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      WP_API_URL: ${{ secrets.WP_API_URL }}
      WP_MEDIA_API_URL: ${{ secrets.WP_MEDIA_API_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_TIMEZONE: ${{ secrets.WP_TIMEZONE || 'Asia/Tokyo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: Get changed images in merged PR
        id: changed
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const images = data
              .map(f => f.filename)
              .filter(f => /^images\/.*\.(jpe?g|png|webp)$/i.test(f));
            console.log('changed images:', images.join(', ') || '(none)');
            return images.join(' ');

      - name: Apply images as thumbnails and republish matching pairs
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          inject_thumbnail() {
            local file="$1"
            local image="$2"

            if grep -Eq '^(thumbnail|featured_image):' "$file"; then
              echo "thumbnail already declared in $file; leaving it unchanged"
              return 0
            fi

            awk -v image="$image" '
              BEGIN { in_frontmatter=0; added=0 }
              NR == 1 && $0 == "---" { in_frontmatter=1 }
              {
                print
                if (in_frontmatter && !added && $0 ~ /^slug:/) {
                  print "thumbnail: \"" image "\""
                  added=1
                }
              }
              NR > 1 && in_frontmatter && $0 == "---" { in_frontmatter=0 }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          }

          for image in ${{ steps.changed.outputs.result }}; do
            filename="$(basename "$image")"
            base="${filename%.*}"

            draft="$(find drafts -type f \( -name "${base}-jp.md" -o -name "${base}-ja.md" \) | head -n 1 || true)"
            if [ -z "$draft" ]; then
              echo "No matching JP/JA draft for $image; skipping"
              continue
            fi

            dir="$(dirname "$draft")"
            stem="$(basename "$draft")"
            if [[ "$stem" == *-jp.md ]]; then
              pair="$dir/${stem%-jp.md}-en.md"
            else
              pair="$dir/${stem%-ja.md}-en.md"
            fi

            if [ ! -f "$pair" ]; then
              echo "No EN pair for $draft; skipping"
              continue
            fi

            echo "Using $image as thumbnail for $draft and $pair"
            inject_thumbnail "$draft" "$image"
            inject_thumbnail "$pair" "$image"
            node src/index.js post-pair "$draft" --now
          done

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const images = '${{ steps.changed.outputs.result }}'.trim();
            const list = images ? images.split(' ').map(f => `- \`${f}\``).join('\n') : '- (no matching images)';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🖼️ Thumbnail pipeline\n\nProcessed image changes:\n${list}\n\nMatching bilingual article pairs were republished with the image set as WordPress featured media.`
            });
