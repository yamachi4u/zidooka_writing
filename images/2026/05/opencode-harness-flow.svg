<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Segoe UI,Meiryo,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cli" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sdk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="acp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="bold">OpenCode CLI — 他ハーネスからの呼び出しパターン</text>
  <text x="480" y="70" text-anchor="middle" fill="#64748b" font-size="14">4 Integration Patterns for Calling OpenCode from Another Harness</text>

  <!-- Harness Box (top) -->
  <rect x="340" y="100" width="280" height="48" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="130" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">あなたのアプリ / スクリプト</text>
  <text x="480" y="138" text-anchor="middle" fill="#94a3b8" font-size="9">Your Harness / CI Pipeline / Application</text>

  <!-- Arrows from harness to 4 branches -->
  <line x1="420" y1="148" x2="130" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="148" x2="350" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="148" x2="610" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="148" x2="830" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pattern 1: CLI run -->
  <rect x="20" y="250" width="220" height="200" rx="10" fill="#0f2740" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="250" width="220" height="32" rx="10" fill="url(#cli)"/>
  <rect x="20" y="270" width="220" height="12" fill="url(#cli)"/>
  <text x="130" y="271" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">① CLI run (非対話モード)</text>
  <text x="130" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">最もシンプル</text>
  <rect x="35" y="312" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="50" y="331" fill="#38bdf8" font-size="10" font-family="monospace">opencode run "prompt"</text>
  <rect x="35" y="346" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="50" y="365" fill="#38bdf8" font-size="10" font-family="monospace">  -m provider/model</text>
  <rect x="35" y="380" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="50" y="399" fill="#38bdf8" font-size="10" font-family="monospace">  --dir /path --format json</text>
  <text x="50" y="426" fill="#94a3b8" font-size="10">返り値: stdout (テキスト) または</text>
  <text x="50" y="440" fill="#94a3b8" font-size="10">--format json で JSON イベント</text>

  <!-- Pattern 2: Server REST -->
  <rect x="260" y="250" width="220" height="200" rx="10" fill="#0f2a1a" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="260" y="250" width="220" height="32" rx="10" fill="url(#server)"/>
  <rect x="260" y="270" width="220" height="12" fill="url(#server)"/>
  <text x="370" y="271" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">② serve + REST API</text>
  <text x="370" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">永続サーバー型</text>
  <rect x="275" y="312" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="290" y="331" fill="#4ade80" font-size="10" font-family="monospace">opencode serve --port 4096</text>
  <rect x="275" y="346" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="290" y="365" fill="#4ade80" font-size="10" font-family="monospace">POST /session/{id}/message</text>
  <rect x="275" y="380" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="290" y="399" fill="#4ade80" font-size="10" font-family="monospace">SSE /event でリアルタイム</text>
  <text x="290" y="426" fill="#94a3b8" font-size="10">返り値: JSON (OpenAPI 3.1)</text>
  <text x="290" y="440" fill="#94a3b8" font-size="10">Basic認証で保護可能</text>

  <!-- Pattern 3: SDK -->
  <rect x="500" y="250" width="220" height="200" rx="10" fill="#1a0f3a" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="500" y="250" width="220" height="32" rx="10" fill="url(#sdk)"/>
  <rect x="500" y="270" width="220" height="12" fill="url(#sdk)"/>
  <text x="610" y="271" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">③ JS/TS SDK</text>
  <text x="610" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">最も高機能</text>
  <rect x="515" y="312" width="190" height="28" rx="4" fill="#0a1929"/>
  <text x="530" y="331" fill="#a78bfa" font-size="10" font-family="monospace">npm i @opencode-ai/sdk</text>
  <rect x="515" y="346" width="190" height="52" rx="4" fill="#0a1929"/>
  <text x="530" y="363" fill="#a78bfa" font-size="9.5" font-family="monospace">createOpencode()</text>
  <text x="530" y="378" fill="#a78bfa" font-size="9.5" font-family="monospace">→ session.prompt(...)</text>
  <text x="530" y="393" fill="#a78bfa" font-size="9.5" font-family="monospace">→ structured output</text>
  <text x="530" y="426" fill="#94a3b8" font-size="10">返り値: 型安全な応答</text>
  <text x="530" y="440" fill="#94a3b8" font-size="10">session/list/file/TUI制御可</text>

  <!-- Pattern 4: ACP -->
  <rect x="740" y="250" width="200" height="200" rx="10" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="250" width="200" height="32" rx="10" fill="url(#acp)"/>
  <rect x="740" y="270" width="200" height="12" fill="url(#acp)"/>
  <text x="840" y="271" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">④ ACP プロトコル</text>
  <text x="840" y="300" text-anchor="middle" fill="#94a3b8" font-size="10">エディタ / stdin</text>
  <rect x="752" y="312" width="176" height="28" rx="4" fill="#0a1929"/>
  <text x="764" y="331" fill="#fbbf24" font-size="10" font-family="monospace">opencode acp</text>
  <rect x="752" y="346" width="176" height="28" rx="4" fill="#0a1929"/>
  <text x="764" y="365" fill="#fbbf24" font-size="10" font-family="monospace">JSON-RPC over stdio</text>
  <rect x="752" y="380" width="176" height="28" rx="4" fill="#0a1929"/>
  <text x="764" y="399" fill="#fbbf24" font-size="10" font-family="monospace">Zed / JetBrains対応</text>
  <text x="764" y="426" fill="#94a3b8" font-size="10">返り値: nd-JSON 応答</text>
  <text x="764" y="440" fill="#94a3b8" font-size="10">エディタ内蔵型に最適</text>

  <!-- Comparison table -->
  <rect x="20" y="470" width="920" height="170" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>

  <text x="480" y="496" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">各方式の比較</text>

  <!-- Table header -->
  <rect x="40" y="508" width="880" height="24" rx="4" fill="#0f172a"/>
  <text x="85" y="525" fill="#64748b" font-size="11" font-weight="bold">項目</text>
  <text x="250" y="525" fill="#38bdf8" font-size="11" font-weight="bold">① CLI run</text>
  <text x="465" y="525" fill="#4ade80" font-size="11" font-weight="bold">② serve+REST</text>
  <text x="685" y="525" fill="#a78bfa" font-size="11" font-weight="bold">③ SDK</text>
  <text x="850" y="525" fill="#fbbf24" font-size="11" font-weight="bold">④ ACP</text>

  <!-- Table rows -->
  <rect x="40" y="536" width="880" height="22" rx="0" fill="#0f172a" fill-opacity="0.4"/>
  <text x="85" y="552" fill="#94a3b8" font-size="10">立ち上げ</text>
  <text x="250" y="552" fill="#cbd5e1" font-size="10">1回のプロセス起動</text>
  <text x="465" y="552" fill="#cbd5e1" font-size="10">バックグラウンド常駐</text>
  <text x="685" y="552" fill="#cbd5e1" font-size="10">コード内で起動</text>
  <text x="850" y="552" fill="#cbd5e1" font-size="10">エディタ連携</text>

  <rect x="40" y="560" width="880" height="22" rx="0" fill="#0f172a" fill-opacity="0.25"/>
  <text x="85" y="576" fill="#94a3b8" font-size="10">返り値</text>
  <text x="250" y="576" fill="#cbd5e1" font-size="10">stdout / JSON</text>
  <text x="465" y="576" fill="#cbd5e1" font-size="10">JSON + SSE</text>
  <text x="685" y="576" fill="#cbd5e1" font-size="10">型付きJSオブジェクト</text>
  <text x="850" y="576" fill="#cbd5e1" font-size="10">nd-JSON</text>

  <rect x="40" y="584" width="880" height="22" rx="0" fill="#0f172a" fill-opacity="0.4"/>
  <text x="85" y="600" fill="#94a3b8" font-size="10">ファイル操作</text>
  <text x="250" y="600" fill="#cbd5e1" font-size="10">ディレクトリ単位</text>
  <text x="465" y="600" fill="#cbd5e1" font-size="10">セッション+全操作</text>
  <text x="685" y="600" fill="#cbd5e1" font-size="10">セッション+全操作</text>
  <text x="850" y="600" fill="#cbd5e1" font-size="10">ファイル・ツール可</text>

  <rect x="40" y="608" width="880" height="22" rx="4" fill="#0f172a" fill-opacity="0.25"/>
  <text x="85" y="624" fill="#94a3b8" font-size="10">ユースケース</text>
  <text x="250" y="624" fill="#cbd5e1" font-size="10">CI/CD, バッチ, cron</text>
  <text x="465" y="624" fill="#cbd5e1" font-size="10">Webアプリ, Chatbot</text>
  <text x="685" y="624" fill="#cbd5e1" font-size="10">Node統合, エージェント</text>
  <text x="850" y="624" fill="#cbd5e1" font-size="10">IDEプラグイン</text>

  <!-- Footer -->
  <text x="480" y="670" text-anchor="middle" fill="#475569" font-size="11">すべての方式で -m (モデル指定) と --dir (作業場所指定) が利用可能</text>
  <text x="480" y="695" text-anchor="middle" fill="#64748b" font-size="11">flow diagram for OpenCode harness integration patterns</text>
</svg>
