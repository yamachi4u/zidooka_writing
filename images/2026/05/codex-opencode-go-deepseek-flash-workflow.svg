<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex and OpenCode Go workflow with DeepSeek V4 Flash</title>
  <desc id="desc">A workflow diagram showing Codex with a GPT-5.5-class model planning tasks, OpenCode Go dispatching them, DeepSeek V4 Flash executing, and results returning to Codex for review.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 3; }
      .panel-dark { fill: #18202b; stroke: #18202b; stroke-width: 3; }
      .accent { fill: #0f766e; }
      .accent2 { fill: #c2410c; }
      .muted { fill: #64748b; }
      .text { fill: #111827; font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; }
      .text-light { fill: #ffffff; font-family: "Segoe UI", "Noto Sans JP", Arial, sans-serif; }
      .small { font-size: 30px; font-weight: 500; }
      .body { font-size: 36px; font-weight: 600; }
      .label { font-size: 40px; font-weight: 700; }
      .title { font-size: 56px; font-weight: 800; }
      .arrow { stroke: #334155; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .return { stroke: #0f766e; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead-green); stroke-dasharray: 18 18; }
    </style>
    <marker id="arrowhead" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M2,2 L16,9 L2,16 Z" fill="#334155"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M2,2 L16,9 L2,16 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="text title" x="800" y="95" text-anchor="middle">Codex plans, Flash executes</text>
  <text class="text small muted" x="800" y="145" text-anchor="middle">Strong model for judgment. Fast model for throughput.</text>

  <rect class="panel-dark" x="90" y="270" width="350" height="210" rx="18"/>
  <text class="text-light label" x="265" y="340" text-anchor="middle">Codex</text>
  <text class="text-light body" x="265" y="392" text-anchor="middle">GPT-5.5 class</text>
  <text class="text-light small" x="265" y="438" text-anchor="middle">planning / judgment</text>

  <rect class="panel" x="625" y="270" width="350" height="210" rx="18"/>
  <rect class="accent" x="625" y="270" width="350" height="16" rx="8"/>
  <text class="text label" x="800" y="345" text-anchor="middle">OpenCode Go</text>
  <text class="text body" x="800" y="397" text-anchor="middle">model selection</text>
  <text class="text small muted" x="800" y="443" text-anchor="middle">dispatch smaller tasks</text>

  <rect class="panel" x="1160" y="270" width="350" height="210" rx="18"/>
  <rect class="accent2" x="1160" y="270" width="350" height="16" rx="8"/>
  <text class="text label" x="1335" y="335" text-anchor="middle">DeepSeek</text>
  <text class="text body" x="1335" y="390" text-anchor="middle">V4 Flash</text>
  <text class="text small muted" x="1335" y="438" text-anchor="middle">fast execution</text>

  <path class="arrow" d="M450 375 H598"/>
  <path class="arrow" d="M985 375 H1133"/>

  <rect class="panel" x="300" y="635" width="1000" height="120" rx="18"/>
  <text class="text body" x="800" y="690" text-anchor="middle">Review result in Codex, then send the next task</text>
  <text class="text small muted" x="800" y="735" text-anchor="middle">plan → execute → inspect → repeat</text>

  <path class="return" d="M1335 500 C1335 600 1210 695 1300 695"/>
  <path class="return" d="M300 695 C180 695 155 570 220 505"/>

  <circle class="accent" cx="126" cy="693" r="12"/>
  <circle class="accent2" cx="1474" cy="693" r="12"/>
</svg>
